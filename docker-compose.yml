services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./application/cache/sessions:/var/www/html/application/cache/sessions
    environment:
      - CI_ENV=development
    networks:
      - zerone-network

networks:
  zerone-network:
    driver: bridge
